<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불행의 룰렛</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- confetti 불꽃놀이 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #111827; /* 배경칼라 블랙 (Tailwind gray-900) */
            color: #f3f4f6;
        }
        
        #wheelContainer {
            transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
        }

        /* 타이틀 글씨 붉은 네온 글로우 및 애니메이션 효과 */
        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(220, 38, 38, 0.6), 0 0 30px rgba(185, 28, 28, 0.4);
            }
            50% {
                text-shadow: 0 0 20px rgba(255, 0, 0, 1), 0 0 35px rgba(239, 68, 68, 0.9), 0 0 50px rgba(220, 38, 38, 0.8), 0 0 60px rgba(153, 27, 27, 0.6);
            }
        }

        @keyframes skullFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.15) rotate(-5deg); }
        }

        @keyframes textShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
        }

        .title-glow-effect {
            animation: titleGlow 2.5s ease-in-out infinite, textShake 4s ease-in-out infinite;
        }

        .skull-anim {
            display: inline-block;
            animation: skullFloat 2s ease-in-out infinite;
        }

        .skull-anim-delay {
            display: inline-block;
            animation: skullFloat 2s ease-in-out 1s infinite;
        }

        /* 스크롤바 커스텀 디자인 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937; /* 어두운 테마 트랙 */
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563; /* 어두운 테마 썸 */
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        
        /* 초기 화면 및 항목 박스 크기를 10칸 높이(480px)로 엄격 고정 */
        #segmentInputs {
            height: 480px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="bg-gray-800 rounded-3xl shadow-2xl shadow-black w-full max-w-5xl overflow-hidden flex flex-col md:flex-row border border-gray-700">
        
        <!-- 왼쪽: 룰렛 휠 영역 -->
        <section class="flex-1 p-8 bg-gray-900 border-b md:border-b-0 md:border-r border-gray-700 flex flex-col items-center justify-center relative">
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-red-500 mb-8 absolute top-8 text-center w-full tracking-wider title-glow-effect flex items-center justify-center gap-2 px-2 flex-wrap">
                <span class="skull-anim">💀</span>
                <span>불행의 룰렛</span>
                <span class="text-sm sm:text-base lg:text-xl font-bold text-red-400 bg-red-950/70 px-3 py-1 rounded-full border border-red-800/80 shadow-inner">
                    (나만 아니면 돼!!)
                </span>
                <span class="skull-anim-delay">💀</span>
            </h1>
            
            <div class="relative w-full max-w-md aspect-square mt-12 md:mt-0">
                <!-- 룰렛 화살표 (포인터) -->
                <div class="absolute -top-6 left-1/2 -translate-x-1/2 z-20">
                    <svg class="w-12 h-12 text-red-500 drop-shadow-md" viewBox="0 0 384 512" fill="currentColor">
                        <path d="M384 192c0 87.4-117 243-168.3 307.2c-12.3 15.3-35.1 15.3-47.4 0C117 435 0 279.4 0 192C0 86 86 0 192 0S384 86 384 192z"/>
                    </svg>
                </div>
                
                <!-- 룰렛 캔버스 컨테이너 -->
                <div id="wheelContainer" class="w-full h-full rounded-full shadow-lg">
                    <canvas id="wheel" width="500" height="500" class="w-full h-full"></canvas>
                </div>
                
                <!-- 중앙 스핀 버튼 -->
                <button id="spinBtn" onclick="spinWheel()" disabled
                    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-24 h-24 bg-gradient-to-tr from-red-600 to-pink-500 rounded-full text-white font-bold text-2xl shadow-lg border-4 border-white transform transition hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center justify-center">
                    SPIN
                </button>
            </div>

            <!-- 룰렛 하단 컨트롤 버튼 (랜덤 섞기 & START) -->
            <div class="mt-6 flex items-center justify-center gap-3 w-full max-w-md z-10">
                <button id="shuffleBtn" onclick="shuffleSegments()" disabled
                    class="flex-1 py-3 px-4 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 text-yellow-400 font-bold rounded-xl border border-yellow-500/30 shadow-lg transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <span>🔀</span> 순서 섞기
                </button>
                <button id="startBtn" onclick="spinWheel()" disabled
                    class="flex-1 py-3 px-4 bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-white font-bold text-lg rounded-xl shadow-lg shadow-red-950/50 border border-red-500 transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <span>🔥</span> START
                </button>
            </div>
        </section>

        <!-- 오른쪽: 설정 패널 -->
        <section class="w-full md:w-96 p-8 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-200 flex items-center gap-2">
                    <span>⚙️</span> 룰렛 설정
                </h2>
                <button id="resetBtn" onclick="resetRoulette()"
                    class="px-3 py-1.5 bg-gray-700 hover:bg-red-900/60 active:bg-red-950 text-red-400 hover:text-red-300 font-medium text-xs sm:text-sm rounded-xl border border-red-800/50 shadow transition flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed">
                    <span>🔄</span> 초기화
                </button>
            </div>
            
            <div class="mb-4">
                <label for="numSegments" class="block text-sm font-medium text-gray-400 mb-2">칸 수 입력 (최대 50개)</label>
                <input type="number" id="numSegments" min="0" max="50" value="0"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    placeholder="원하는 칸 수를 입력하세요">
            </div>

            <div class="flex-1 flex flex-col min-h-0">
                <label class="block text-sm font-medium text-gray-400 mb-2">항목 입력</label>
                
                <!-- 초기 화면부터 10칸 크기로 고정된 입력 박스 컨테이너 -->
                <div id="segmentInputs" class="overflow-y-auto custom-scrollbar pr-2 space-y-3 pb-2 bg-gray-900/60 rounded-2xl border border-gray-700/60 p-3">
                    <div class="h-full flex flex-col items-center justify-center text-center text-gray-500 text-sm">
                        <span class="text-3xl mb-2 opacity-60">🎯</span>
                        <span>칸 수를 입력하면<br>여기에 입력창이 나타납니다.</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 결과 알림 모달창 -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-gray-800 rounded-3xl p-8 max-w-sm w-full shadow-2xl border border-gray-700 transform scale-95 transition-transform duration-300 text-center relative overflow-hidden" id="modalContent">
            <!-- 데코레이션 요소 -->
            <div class="absolute -top-10 -left-10 w-24 h-24 bg-red-900 rounded-full mix-blend-screen filter blur-xl opacity-70"></div>
            <div class="absolute -bottom-10 -right-10 w-24 h-24 bg-purple-900 rounded-full mix-blend-screen filter blur-xl opacity-70"></div>
            
            <h3 class="text-xl font-medium text-gray-400 mb-2 relative z-10">☠️ 당첨 결과 ☠️</h3>
            <p id="winnerText" class="text-4xl font-bold text-red-500 mb-8 relative z-10 break-words">결과</p>
            <button onclick="closeModal()" class="w-full py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition relative z-10">
                인정하기
            </button>
        </div>
    </div>

    <script>
        // 상태 변수
        let segments = [];
        let currentRotation = 0;
        let isSpinning = false;
        let tickAnimId = null;
        
        // Web Audio API 효과음 생성
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 회전 딸깍음 (Tick Sound)
        function playTickSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.03);
                
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.03);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.03);
            } catch(e) {}
        }

        // 당첨(벌칙) 비웃음 효과음 (Mocking Evil Laugh Sound)
        function playLaughSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                
                // 비웃음 "콰하하하하!" 리듬 패턴 (음높이, 시작시간, 지속시간)
                const laughNotes = [
                    { time: 0.00, pitch: 360, dur: 0.14 },
                    { time: 0.16, pitch: 420, dur: 0.14 },
                    { time: 0.32, pitch: 390, dur: 0.14 },
                    { time: 0.48, pitch: 350, dur: 0.15 },
                    { time: 0.65, pitch: 310, dur: 0.18 },
                    { time: 0.85, pitch: 250, dur: 0.28 },
                    { time: 1.15, pitch: 190, dur: 0.40 }
                ];

                laughNotes.forEach(note => {
                    const startTime = now + note.time;
                    
                    // Sawtooth 파형과 서브 옥타브 트라이앵글 오실레이터 조합 (음산하고 얄미운 목소리 톤)
                    const osc = ctx.createOscillator();
                    const subOsc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const filter = ctx.createBiquadFilter();

                    osc.type = 'sawtooth';
                    subOsc.type = 'triangle';

                    // 인간의 목소리(포먼트)와 비슷한 주파수대 필터링
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(850, startTime);
                    filter.Q.setValueAtTime(2.5, startTime);

                    // 피치 급강하 효과 ("하-!" 하고 음이 떨어지는 소리)
                    osc.frequency.setValueAtTime(note.pitch, startTime);
                    osc.frequency.exponentialRampToValueAtTime(Math.max(note.pitch * 0.55, 50), startTime + note.dur);

                    subOsc.frequency.setValueAtTime(note.pitch / 2, startTime);
                    subOsc.frequency.exponentialRampToValueAtTime(Math.max((note.pitch * 0.55) / 2, 25), startTime + note.dur);

                    // 끊어치는 볼륨 엔벨로프 (스타카토 비웃음)
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.35, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.dur);

                    osc.connect(filter);
                    subOsc.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    subOsc.start(startTime);
                    osc.stop(startTime + note.dur);
                    subOsc.stop(startTime + note.dur);
                });
            } catch(e) {}
        }

        // DOM 요소
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const wheelContainer = document.getElementById('wheelContainer');
        const numSegmentsInput = document.getElementById('numSegments');
        const segmentInputsContainer = document.getElementById('segmentInputs');
        const spinBtn = document.getElementById('spinBtn');
        const startBtn = document.getElementById('startBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modal = document.getElementById('resultModal');
        const modalContent = document.getElementById('modalContent');
        const winnerText = document.getElementById('winnerText');

        // 초기화
        window.onload = () => {
            drawWheel();
            numSegmentsInput.addEventListener('input', handleCountChange);
        };

        function updateButtonStates() {
            const isDisabled = segments.length === 0 || isSpinning;
            spinBtn.disabled = isDisabled;
            startBtn.disabled = isDisabled;
            shuffleBtn.disabled = segments.length <= 1 || isSpinning;
            if (resetBtn) resetBtn.disabled = isSpinning;
        }

        function resetRoulette() {
            if (isSpinning) return;
            getAudioContext();
            
            segments = [];
            currentRotation = 0;
            wheelContainer.style.transform = `rotate(0deg)`;
            numSegmentsInput.value = 0;
            
            renderInputs();
            drawWheel();
            updateButtonStates();
            playTickSound();
        }

        function handleCountChange(e) {
            if (isSpinning) return; // 회전 중에는 변경 불가
            
            let count = parseInt(e.target.value) || 0;
            // 안전을 위해 최대값 제한
            if (count > 50) {
                count = 50;
                e.target.value = 50;
            }

            if (count === 0) {
                segments = [];
            } else {
                const newSegments = [];
                for (let i = 0; i < count; i++) {
                    // 기존에 입력된 값이 있으면 유지, 없으면 기본값 할당
                    newSegments.push(segments[i] !== undefined ? segments[i] : `항목 ${i + 1}`);
                }
                segments = newSegments;
            }

            renderInputs();
            drawWheel();
            updateButtonStates();
        }

        function shuffleSegments() {
            if (isSpinning || segments.length <= 1) return;
            getAudioContext();
            
            // Fisher-Yates 랜덤 셔플
            for (let i = segments.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [segments[i], segments[j]] = [segments[j], segments[i]];
            }

            renderInputs();
            drawWheel();
            playTickSound();
        }

        function renderInputs() {
            segmentInputsContainer.innerHTML = '';
            
            if (segments.length === 0) {
                segmentInputsContainer.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-center text-gray-500 text-sm"><span class="text-3xl mb-2 opacity-60">🎯</span><span>칸 수를 입력하면<br>여기에 입력창이 나타납니다.</span></div>';
                return;
            }

            segments.forEach((seg, i) => {
                const inputGroup = document.createElement('div');
                inputGroup.className = 'flex items-center space-x-2';
                
                const label = document.createElement('span');
                label.className = 'w-6 text-center text-sm font-bold text-gray-400';
                label.textContent = i + 1;

                const input = document.createElement('input');
                input.type = 'text';
                input.value = seg;
                // 포커스/입력 시 테두리가 노란색으로 표시되도록 스타일 변경
                input.className = 'flex-1 px-3 py-2 border border-gray-600 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 text-sm transition focus:bg-gray-600';
                
                // 입력 값이 바뀔 때마다 캔버스 실시간 렌더링
                input.oninput = (e) => {
                    segments[i] = e.target.value;
                    drawWheel();
                };

                inputGroup.appendChild(label);
                inputGroup.appendChild(input);
                segmentInputsContainer.appendChild(inputGroup);
            });
        }

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 245; // 경계를 벗어나지 않게 여백 조정

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 항목이 0개일 때 (빈 원형)
            if (segments.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#374151'; // gray-700
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#4b5563'; // gray-600
                ctx.stroke();
                
                // 중앙 원
                ctx.beginPath();
                ctx.arc(centerX, centerY, 55, 0, 2 * Math.PI);
                ctx.fillStyle = '#1f2937'; // gray-800
                ctx.fill();
                return;
            }

            // 항목이 있을 때 칸 그리기
            const sliceAngle = (2 * Math.PI) / segments.length;

            for (let i = 0; i < segments.length; i++) {
                // 부채꼴 그리기
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
                
                // 색상 생성 (어두운 테마에 맞춰 명도 낮춤)
                const hue = (i * 360) / segments.length;
                ctx.fillStyle = `hsl(${hue}, 70%, 45%)`;
                ctx.fill();
                
                // 칸 경계선
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#1f2937'; // 테두리를 어둡게
                ctx.stroke();

                // 텍스트 그리기
                ctx.save();
                ctx.translate(centerX, centerY);
                // 해당 칸의 중간 각도로 회전
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                
                // 글자 수나 칸 수에 맞춰 폰트 크기 동적 조절
                const fontSize = segments.length > 20 ? 14 : segments.length > 10 ? 18 : 24;
                ctx.font = `bold ${fontSize}px 'Noto Sans KR', sans-serif`;
                
                // 텍스트 그림자 효과 (가독성 향상)
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                // 텍스트 렌더링 (경계 끝부분에서 조금 띄움, 너비 제한 설정)
                ctx.fillText(segments[i], radius - 25, 0, radius - 80);
                
                ctx.restore();
            }

            // 중앙 원 (스핀 버튼이 들어갈 공간 확보)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 55, 0, 2 * Math.PI);
            ctx.fillStyle = '#1f2937'; // 어두운 색상
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#374151';
            ctx.stroke();
        }

        function spinWheel() {
            if (segments.length === 0 || isSpinning) return;
            getAudioContext();
            
            isSpinning = true;
            numSegmentsInput.disabled = true;
            updateButtonStates();

            // 추가 회전: 기본 4바퀴(1440도) ~ 7바퀴 + 랜덤 각도
            const randomSpins = 4 + Math.floor(Math.random() * 4);
            const randomAngle = Math.floor(Math.random() * 360);
            const targetAddedRotation = (randomSpins * 360) + randomAngle;

            currentRotation += targetAddedRotation;

            // CSS 트랜지션 적용하여 회전
            wheelContainer.style.transform = `rotate(${currentRotation}deg)`;

            // 회전 시 실시간 효과음(Tick) 감지
            let prevRawAngle = 0;
            const sliceDeg = 360 / segments.length;

            function checkTick() {
                if (!isSpinning) return;
                const st = window.getComputedStyle(wheelContainer);
                const tr = st.getPropertyValue("transform");
                if (tr && tr !== 'none') {
                    const values = tr.split('(')[1].split(')')[0].split(',');
                    const a = parseFloat(values[0]);
                    const b = parseFloat(values[1]);
                    let deg = Math.atan2(b, a) * (180 / Math.PI);
                    if (deg < 0) deg += 360;

                    const delta = Math.abs(deg - prevRawAngle);
                    const normalizedDelta = delta > 180 ? 360 - delta : delta;

                    if (normalizedDelta >= sliceDeg) {
                        playTickSound();
                        prevRawAngle = deg;
                    }
                }
                tickAnimId = requestAnimationFrame(checkTick);
            }
            checkTick();

            // 애니메이션이 끝난 후(4초) 결과 계산
            setTimeout(() => {
                isSpinning = false;
                if (tickAnimId) cancelAnimationFrame(tickAnimId);
                numSegmentsInput.disabled = false;
                updateButtonStates();
                calculateWinner();
            }, 4050); // 트랜지션 4초 + 버퍼 50ms
        }

        function calculateWinner() {
            // 회전값을 360 내의 양수로 정규화
            const normalizedRotation = currentRotation % 360;
            
            // 캔버스 구조상 0도는 3시 방향. 포인터는 12시 방향(-90도 또는 270도 위치).
            // 룰렛이 시계방향으로 normalizedRotation만큼 돌았을 때, 12시에 위치하는 칸을 역추적.
            const topLocalAngle = (270 - normalizedRotation + 360) % 360;
            
            const sliceAngleDeg = 360 / segments.length;
            const winnerIndex = Math.floor(topLocalAngle / sliceAngleDeg);
            
            const winner = segments[winnerIndex];
            showModal(winner);
        }

        function showModal(winner) {
            winnerText.textContent = winner;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // 비웃음 효과음 & 불꽃놀이 효과 실행
            playLaughSound();
            fireworks();
            
            // 약간의 딜레이를 주어 transition(opacity, scale) 적용
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300); // transition duration과 맞춤
        }

        // 불꽃놀이 효과 함수 (canvas-confetti)
        function fireworks() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 60 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                // 양쪽 끝에서 불꽃 터지기
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
